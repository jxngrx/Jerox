name: Release

# Push a tag like v0.2.0 to build Jerox-0.2.0.dmg/.pkg/.zip, appcast.xml, and publish a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: the build number is the commit count
      - name: Self-checks
        run: make test
      - name: Import signing certificates
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          INSTALLER_CERTIFICATE_BASE64: ${{ secrets.INSTALLER_CERTIFICATE_BASE64 }}
          INSTALLER_P12_PASSWORD: ${{ secrets.INSTALLER_P12_PASSWORD }}
        run: |
          if [ -z "${BUILD_CERTIFICATE_BASE64:-}" ]; then
            echo "No BUILD_CERTIFICATE_BASE64; release.sh signs ad hoc."
            exit 0
          fi
          CERT="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          if [ -n "${INSTALLER_CERTIFICATE_BASE64:-}" ]; then
            INSTALLER_CERT="$RUNNER_TEMP/installer_certificate.p12"
            echo -n "$INSTALLER_CERTIFICATE_BASE64" | base64 --decode > "$INSTALLER_CERT"
            security import "$INSTALLER_CERT" -P "${INSTALLER_P12_PASSWORD:-$P12_PASSWORD}" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          fi
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
      - name: Build DMG, installer, Sparkle zip
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
          INSTALLER_IDENTITY: ${{ secrets.INSTALLER_IDENTITY }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: scripts/release.sh "${GITHUB_REF_NAME#v}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Jerox ${GITHUB_REF_NAME#v}" --generate-notes
