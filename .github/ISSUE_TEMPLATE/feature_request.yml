name: Feature request
description: Suggest an idea for Jerox.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and where does Jerox get in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How should it work? Jerox works where you already are, so describe it in the app you are using.
    validations:
      required: true
