name: Bug report
description: Something in Jerox does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Copy some text in Notes
        2. Press ⌃⌥⌘V
        3. ...
    validations:
      required: true
  - type: dropdown
    id: feature
    attributes:
      label: Feature
      options: [Clipboard history, Rewrite, Dictation, Read the screen, Settings, Other]
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.4"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Jerox version or commit
  - type: textarea
    id: extra
    attributes:
      label: Logs or screenshots
      description: Remove any private clipboard content first.
